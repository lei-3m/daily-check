<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Check" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS는 자기 모양으로 잘라내고 투명한 곳은 검게 채운다.
         둥근 모서리가 없는 꽉 찬 아이콘을 줘야 모서리에 검은 자국이 남지 않는다. -->
    <link rel="apple-touch-icon" href="/icon-maskable-192.png" />
    <title>Daily Check</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('daily-check:theme');
          var storedAccent = localStorage.getItem('daily-check:accent');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var accent =
            storedAccent === 'default' ||
            storedAccent === 'blue' ||
            storedAccent === 'green' ||
            storedAccent === 'yellow' ||
            storedAccent === 'pink' ||
            storedAccent === 'orange' ||
            storedAccent === 'purple'
              ? storedAccent
              : 'default';
          var isDark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.dataset.theme = preference;
          document.documentElement.dataset.accent = accent;
        } catch (_error) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.dataset.theme = 'system';
          document.documentElement.dataset.accent = 'default';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
